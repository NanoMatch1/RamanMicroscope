name: tests

# Both suites run without any hardware attached: the Arduino, laser,
# spectrometer and camera are all replaced by simulators, and the workflow
# test drives the real command handler with stdin closed. That is what makes
# CI possible for an instrument-control repository at all.

on:
  push:   # every branch: anything pushed to a public repository is public
    branches: ['**']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  # The repository is public: this rejects personal emails, home-directory
  # paths, private share links, data files and large binaries in the pushed
  # changes, and any commit identity that would publish a personal address.
  # Same checks as the local pre-commit hook (.githooks/), so skipping the
  # hook only delays the failure. Standard library only: no install step.
  repo-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the range check needs the commits being pushed

      - name: Check pushed changes
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # Pull request: everything since the base. Push: everything since
          # the previous tip, or, for a new branch, since it left develop.
          if [ -n "$PR_BASE" ]; then
            base="$PR_BASE"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            base="$PUSH_BEFORE"
          else
            base=$(git merge-base origin/develop HEAD)
          fi
          echo "Checking $base..HEAD"
          python tools/repo_guard.py range "$base" HEAD

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # PyQt5 needs these shared libraries present even when it never opens a
      # window. The application imports matplotlib's Qt5 backend at module
      # load, so they are required to import the code, not only to run a GUI.
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run test suites
        env:
          QT_QPA_PLATFORM: offscreen   # no display on a CI runner
          MPLBACKEND: Agg
        run: |
          python -m pytest test_controller_simulated.py test_headless_simulation.py test_repo_guard.py -q
