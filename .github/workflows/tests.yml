name: tests

# Both suites run without any hardware attached: the Arduino, laser,
# spectrometer and camera are all replaced by simulators, and the workflow
# test drives the real command handler with stdin closed. That is what makes
# CI possible for an instrument-control repository at all.

on:
  push:
    branches: [develop, main, 'feature/**', 'fix/**']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # PyQt5 needs these shared libraries present even when it never opens a
      # window. The application imports matplotlib's Qt5 backend at module
      # load, so they are required to import the code, not only to run a GUI.
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run test suites
        env:
          QT_QPA_PLATFORM: offscreen   # no display on a CI runner
          MPLBACKEND: Agg
        run: |
          python -m pytest test_controller_simulated.py test_headless_simulation.py -q
